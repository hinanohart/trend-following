[project]
name = "trend-following-pytorch"
version = "0.1.0"
description = "Minimal core of systematic trend following in PyTorch: causal EWMA filters, closed-form normalisation, volatility-targeted positions"
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE", "LICENSE-APACHE"]
requires-python = ">=3.9"
keywords = [
  "trend following",
  "time series momentum",
  "systematic trading",
  "exponential moving average",
  "pytorch"
]
classifiers = [
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Programming Language :: Python :: 3"
]
dependencies = [
  "einops>=0.8.0",
  "torch>=2.0"
]

[project.urls]
Repository = "https://github.com/hinanohart/trend-following"

[project.optional-dependencies]
test = [
  "pytest"
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
core-metadata-version = "2.4"
packages = ["pytorch/trend_following_pytorch"]

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = ["pytorch", "testdata", "README.md", "EVIDENCE.md", "LICENSE", "LICENSE-APACHE"]

[tool.pytest.ini_options]
pythonpath = ["pytorch"]
testpaths = ["pytorch/tests"]
